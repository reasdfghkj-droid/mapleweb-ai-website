name: MapleWeb staging credential readiness (read-only)
on:
  push:
    branches: [mapleweb-ai-agents]
    paths:
      - .github/workflows/mapleweb-staging-credential-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/mapleweb-ai-agents'
    runs-on: ubuntu-latest
    environment: mapleweb-staging
    steps:
      - name: Check Cloudflare deploy credential presence safely
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEVELOPER_URL: ${{ vars.MAPLEWEB_DEVELOPER_STAGING_URL }}
          MANAGER_URL: ${{ vars.MAPLEWEB_MANAGER_STAGING_URL }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/mapleweb-ai-agents'
          if [ -n "$CF_API_TOKEN" ] || [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo 'Cloudflare API token: PRESENT'; else echo 'Cloudflare API token: MISSING'; fi
          if [ -n "$CF_ACCOUNT_ID" ] || [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'Cloudflare account ID: PRESENT'; else echo 'Cloudflare account ID: MISSING'; fi
          if [ -n "$DEVELOPER_URL" ]; then echo 'Developer staging URL: CONFIGURED'; else echo 'Developer staging URL: MISSING'; fi
          if [ -n "$MANAGER_URL" ]; then echo 'Manager staging URL: CONFIGURED'; else echo 'Manager staging URL: MISSING'; fi
          echo 'Read-only: no Cloudflare deployment, database changes, or website publication performed.'
