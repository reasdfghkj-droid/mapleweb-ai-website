name: Import tested MapleWeb package (development only)
on:
  push:
    branches: [mapleweb-ai-agents]
    paths: [mapleweb-ai-completion-tested.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-reviewed-package:
    if: github.ref == 'refs/heads/mapleweb-ai-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mapleweb-ai-agents
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract package for development
        run: |
          test -f mapleweb-ai-completion-tested.zip
          unzip -q mapleweb-ai-completion-tested.zip -d /tmp/mapleweb-reviewed
          mkdir -p public mapleweb-agents/tests
          cp /tmp/mapleweb-reviewed/site/index.html public/index.html
          cp /tmp/mapleweb-reviewed/site/build-with-ai.html public/build-with-ai.html
          cp /tmp/mapleweb-reviewed/workers/mapleweb-agents.mjs mapleweb-agents/worker.mjs
          cp /tmp/mapleweb-reviewed/workers/schema.sql mapleweb-agents/schema.sql
          cp /tmp/mapleweb-reviewed/workers/wrangler.example.jsonc mapleweb-agents/wrangler.example.jsonc
          cp /tmp/mapleweb-reviewed/tests/agents.test.mjs mapleweb-agents/tests/agents.test.mjs
          cp /tmp/mapleweb-reviewed/README.md mapleweb-agents/README.md
      - name: Test Worker and chat safety
        run: |
          node --check mapleweb-agents/worker.mjs
          node --test mapleweb-agents/tests/agents.test.mjs
          test "$GITHUB_REF" = 'refs/heads/mapleweb-ai-agents'
      - name: Save verified development files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/build-with-ai.html mapleweb-agents
          if ! git diff --cached --quiet; then
            git commit -m 'feat: stage tested MapleWeb AI website and agents'
            git push origin HEAD:mapleweb-ai-agents
          fi
