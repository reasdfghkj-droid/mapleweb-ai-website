name: Import tested MapleWeb website and agents (development only)
on:
  push:
    branches: [mapleweb-ai-agents]
    paths: [mapleweb-ai-completion-tested.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-verified:
    if: github.ref == 'refs/heads/mapleweb-ai-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mapleweb-ai-agents
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and extract reviewed package
        env:
          PYTHON_SCRIPT: |
            ZnJvbSB6aXBmaWxlIGltcG9ydCBaaXBGaWxlCmZyb20gcGF0aGxpYiBpbXBvcnQgUGF0aApwPVBhdGgo
            J21hcGxld2ViLWFpLWNvbXBsZXRpb24tdGVzdGVkLnppcCcpCmFzc2VydCBwLmV4aXN0cygpLCAnVXBs
            b2FkIG1hcGxld2ViLWFpLWNvbXBsZXRpb24tdGVzdGVkLnppcCB0byB0aGUgZGV2ZWxvcG1lbnQgYnJh
            bmNoJwpleHBlY3RlZD17J1JFQURNRS5tZCcsJ3Rlc3RzL2FnZW50cy50ZXN0Lm1qcycsJ3Rlc3RzL2Jy
            b3dzZXItY2hlY2sucHknLCdzaXRlL2J1aWxkLXdpdGgtYWkuaHRtbCcsJ3NpdGUvaW5kZXguaHRtbCcs
