            cnMvbWFwbGV3ZWItYWdlbnRzLm1qcyd9CndpdGggWmlwRmlsZShwKSBhcyB6OgogICAgYXNzZXJ0IHNl
            dCh6Lm5hbWVsaXN0KCkpPT1leHBlY3RlZCwgJ1VuZXhwZWN0ZWQgYXJjaGl2ZSBjb250ZW50cycKICAg
            YXNzZXJ0IHN1bShpLmZpbGVfc2l6ZSBmb3IgaSBpbiB6LmluZm9saXN0KCkgaW4gcmFuZ2UoMCwxMDAw
            MCksICdQYWNrYWdlIHRvbyBsYXJnZScKICAgIHByZWZpeD1ieXRlcyhbNjBdKStiJyFkb2N0eXBlIGh0
            bWw+JwogICAgYXNzZXJ0IHoucmVhZCgnc2l0ZS9pbmRleC5odG1sJykubG93ZXIoKS5zdGFydHN3aXRo
            KHByZWZpeCkKICAgIGFzc2VydCB6LnJlYWQoJ3NpdGUvYnVpbGQtd2l0aC1haS5odG1sJykubG93ZXIo
            KS5zdGFydHN3aXRoKHByZWZpeCkKICAgIHBhdGhzPXsKICAgICAgICAnc2l0ZS9pbmRleC5odG1sJzon
            cHVibGljL2luZGV4Lmh0bWwnLAogICAgICAgICdzaXRlL2J1aWxkLXdpdGgtYWkuaHRtbCc6J3B1Ymxp
            Yy9idWlsZC13aXRoLWFpLmh0bWwnLAogICAgICAgICd3b3JrZXJzL21hcGxld2ViLWFnZW50cy5tanMn
            OidtYXBsZXdlYi1hZ2VudHMvd29ya2VyLm1qcycsCiAgICAgICAgJ3dvcmtlcnMvc2NoZW1hLnNxbCc6
            bWFwbGV3ZWItYWdlbnRzL3NjaGVtYS5zcWwnLAogICAgICAgICd3b3JrZXJzL3dyYW5nbGVyLmV4YW1w
