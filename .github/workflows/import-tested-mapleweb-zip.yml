            dC53cml0ZV9ieXRlcyh6LnJlYWQoc3JjKSkK
        run: |
          printf '%s' "$PYTHON_SCRIPT" | base64 -d > /tmp/import-mapleweb.py
          python3 /tmp/import-mapleweb.py
      - name: Test agent security and customer chat
        run: |
          node --check mapleweb-agents/worker.mjs
          node --test mapleweb-agents/tests/agents.test.mjs
          test "$GITHUB_REF" = 'refs/heads/mapleweb-ai-agents'
      - name: Commit only to development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/build-with-ai.html mapleweb-agents
          if ! git diff --cached --quiet; then
            git commit -m 'feat: stage tested MapleWeb AI website and agents'
            git push origin HEAD:mapleweb-ai-agents
          fi
