name: MapleWeb finished website static quality gate
on:
  push:
    branches: [main, mapleweb-final-site-static-qa-2026-11-20]
    paths:
      - 'workers/final-site-static-audit.mjs'
      - 'workers/final-site-files.mjs'
      - 'manager-ui/**'
      - 'tests/**'
      - '.github/workflows/final-site-static-audit.yml'
  pull_request:
    paths:
      - 'workers/final-site-static-audit.mjs'
      - 'workers/final-site-files.mjs'
      - 'manager-ui/**'
      - 'tests/**'
      - '.github/workflows/final-site-static-audit.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run new final site static QA, ZIP transfer and Developer tests
        run: |
          node tests/final-site-static-audit.test.mjs
          node tests/final-site-files.test.mjs
          node tests/site-blueprint.test.mjs
          node tests/agent-operations.test.mjs
          node tests/chat-developer-handoff.test.mjs
      - name: Run complete D1 order, approvals, invoice, deletion and email regressions
        run: |
          node --disable-warning=ExperimentalWarning tests/full-system-sqlite.test.mjs
          node tests/customer-review.test.mjs
          node tests/customer-email.test.mjs
          node tests/live-stripe.test.mjs
          node tests/delivery-quality.test.mjs
          node tests/owner-quote-pack.test.mjs
          node --disable-warning=ExperimentalWarning tests/retention-history.test.mjs
          node tests/scope-pricing.test.mjs
          node tests/sales-studio.test.mjs
      - name: Dry-run both Cloudflare Workers with no production deployment
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --config wrangler.jsonc --outdir ./dist/public
          npx wrangler deploy --dry-run --config wrangler.manager.jsonc --outdir ./dist/private
