name: Deploy MapleWeb AI Developer and Manager (staging only)
# Explicit manual run or a one-time request file; never triggered by normal source changes.
on:
  workflow_dispatch:
  push:
    branches: [mapleweb-ai-agents]
    paths:
      - .github/mapleweb-stage/deploy-request.txt
permissions:
  contents: read
concurrency:
  group: mapleweb-staging
  cancel-in-progress: false
jobs:
  staging:
    if: github.ref == 'refs/heads/mapleweb-ai-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mapleweb-staging
    env:
      # A GitHub Secret (repository or staging environment) is the ONLY credential required.
      # Never commit a Cloudflare API token to source code.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      # Cloudflare account IDs identify accounts but are not passwords or API credentials.
      CLOUDFLARE_ACCOUNT_ID: b1acdb2a70cb895834924156d6b5cf30
      MAPLEWEB_DEVELOPER_STAGING_URL: https://mapleweb-ai-developer-staging.reasdfghkj.workers.dev
      MAPLEWEB_MANAGER_STAGING_URL: https://mapleweb-ai-manager-staging.reasdfghkj.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mapleweb-ai-agents
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify development-only deployment authorization
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/mapleweb-ai-agents'
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Cloudflare API token is missing. Add CLOUDFLARE_API_TOKEN as an Actions secret scoped to this repository or mapleweb-staging environment.'
            exit 1
          fi
          echo 'Cloudflare token configured (value never printed).'
      - name: Run all staging safety and database tests
        run: |
          npm test
          python3 tests/staging-binding-check.py
          node --check workers/developer.mjs
          node --check workers/manager.mjs
      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4
      - name: Resolve existing staging D1 database; never use production
        run: |
          npx wrangler d1 list --json > "$RUNNER_TEMP/mapleweb-d1-list.json"
          node scripts/resolve-staging-d1.mjs workers/wrangler.developer.staging.jsonc < "$RUNNER_TEMP/mapleweb-d1-list.json"
          node scripts/resolve-staging-d1.mjs workers/wrangler.manager.staging.jsonc < "$RUNNER_TEMP/mapleweb-d1-list.json"
      - name: Apply reviewed schema to staging D1 only
        run: npx wrangler d1 execute mapleweb-agent-staging --remote --file workers/schema.sql --yes
      - name: Deploy Developer Worker with customer submissions disabled
        run: npx wrangler deploy --config workers/wrangler.developer.staging.jsonc
      - name: Deploy Manager Worker; unauthorized requests must be denied
        run: npx wrangler deploy --config workers/wrangler.manager.staging.jsonc
      - name: Verify both live staging Workers using synthetic requests
        run: |
          node scripts/smoke-staging.mjs "$MAPLEWEB_DEVELOPER_STAGING_URL"
          node scripts/smoke-manager-staging.mjs "$MAPLEWEB_MANAGER_STAGING_URL"
      - name: Report staging only
        run: |
          echo '## MapleWeb AI staging deployment' >> "$GITHUB_STEP_SUMMARY"
          echo 'Developer and Manager Workers deployed and smoke-tested. No customer submissions were enabled.' >> "$GITHUB_STEP_SUMMARY"
